<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>REDLINE</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0f;overflow:hidden;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;
    font-family:"Arial Black",Impact,"Helvetica Neue",Arial,sans-serif}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;pointer-events:none;font-style:italic}
  #sc{font-size:34px;line-height:1}
  #cb{font-size:15px;color:#ffb000;height:18px}
  #kmh{font-size:26px;text-align:right}
  #kmh small{font-size:13px;opacity:.7}
  #nb{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:92px;height:92px;
    border-radius:50%;border:3px solid #ff7a00;color:#fff;font:inherit;font-size:15px;font-style:italic;
    background:#2a1a10;touch-action:none;box-shadow:0 0 18px rgba(255,122,0,.5);overflow:hidden}
  #nb.on{box-shadow:0 0 34px #ff7a00}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px;background:rgba(10,10,15,.82)}
  #ov.hide{display:none}
  h1{font-size:58px;margin:0;font-style:italic;letter-spacing:2px;color:#ff2d2d;text-shadow:0 0 24px #ff2d2d}
  p{margin:8px 0;max-width:290px;line-height:1.4;font-size:16px;color:#b8b8c4;font-family:Arial,sans-serif;font-weight:normal}
  #big{font-size:30px;color:#fff;font-style:italic}
  button.go{margin-top:24px;font:inherit;font-size:22px;font-style:italic;padding:14px 42px;border-radius:6px;
    background:#ff2d2d;color:#fff;border:0;box-shadow:0 0 22px rgba(255,45,45,.6);touch-action:manipulation}
  button.go:active{background:#c81f1f}
  #gar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;max-width:340px}
  .cb{background:#1a1a24;border:2px solid #333;border-radius:8px;color:#fff;font:inherit;font-size:10px;padding:6px 4px;width:62px;touch-action:manipulation}
  .cb i{display:block;width:16px;height:30px;border-radius:5px;margin:0 auto 4px}
  .cb.sel{border-color:#ff2d2d;box-shadow:0 0 12px rgba(255,45,45,.6)}
  .cb.lock{opacity:.5}
  #lg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;font:inherit;font-size:14px;
    background:#1a1a24;color:#fff;border:2px solid #444;border-radius:20px;padding:8px 14px;touch-action:manipulation}
  #lgs{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);right:14px;grid-template-columns:1fr 1fr;gap:6px;
    background:#12121a;border:2px solid #444;border-radius:12px;padding:8px;z-index:5}
  #lgs.open{display:grid}
  #lgs button{font:inherit;font-size:13px;background:#1a1a24;color:#fff;border:1px solid #444;border-radius:8px;padding:9px 12px;touch-action:manipulation}
  #lgs button:active{background:#ff2d2d}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><div id="sc">0</div><div id="cb"></div></div><div id="kmh">0<small> km/h</small></div></div>
<button id="nb">NITRO</button>
<div id="ov">
  <button id="lg"></button><div id="lgs"></div>
  <h1 id="t">REDLINE</h1>
  <p id="big"></p>
  <p id="m">Húzd az ujjad balra-jobbra (laptopon nyilak vagy A/D). Nitro: gomb vagy az N betű. Menj közel az autókhoz a bónuszért, és pontszámokkal új autókat oldasz fel!</p>
  <p id="b"></p>
  <div id="gar"></div><p id="ci"></p>
  <button class="go" id="go">INDÍTÁS</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,S,dpr,rw,lw,x0,cw,ch,py;
function resize(){
  dpr=Math.min(devicePixelRatio||1,3);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  rw=Math.min(W*.94,440);lw=rw/4;x0=(W-rw)/2;S=rw/360;cw=lw*.58;ch=cw*1.9;py=H*.74;
}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('rl_best')||0}catch(e){}
let boostF=1,mode='menu',px,vx=0,tx,dist=0,score=0,combo=0,comboT=0,nitro=1,nitroOn=false,cars=[],smoke=[],pops=[],t=0,spawn=0,shake=0,speed=0;
const COLS=['#2d7dff','#ffd21f','#38d67a','#a35bff','#e9e9ef','#ff8a2d','#25c6d9'];
const showBest=()=>$('b').textContent=best?T('best')+best:'';
let newCars=[];
const LANGS={hu:"Magyar",en:"English",de:"Deutsch",es:"Español",fr:"Français",it:"Italiano",pl:"Polski",tr:"Türkçe"};
const TX={
 hu:{go:"INDÍTÁS",again:"ÚJRA",crash:"BALESET",score:"Pontszám: ",best:"Rekord: ",unlocked:"ÚJ AUTÓ FELOLDVA: ",pick:"! Válaszd ki lent.",newcar:"ÚJ AUTÓ: ",near:"NEAR MISS x",combo:"COMBO x",
  help:"Húzd az ujjad balra-jobbra (laptopon nyilak vagy A/D). Nitro: gomb vagy az N betű. Menj közel az autókhoz a bónuszért, és pontszámokkal új autókat oldasz fel!",
  info:["Kiegyensúlyozott","Hosszabb nitró","Pontos kormányzás, gyorsabb","Nagyobb near miss bónusz","A leggyorsabb, sok nitró"]},
 en:{go:"START",again:"RETRY",crash:"CRASH",score:"Score: ",best:"Best: ",unlocked:"NEW CAR UNLOCKED: ",pick:"! Pick it below.",newcar:"NEW CAR: ",near:"NEAR MISS x",combo:"COMBO x",
  help:"Drag your finger left/right (laptop: arrows or A/D). Nitro: button or the N key. Pass close to cars for a bonus and unlock new cars with your score!",
  info:["Balanced","Longer nitro","Precise steering, faster","Bigger near miss bonus","Fastest, plenty of nitro"]},
 de:{go:"START",again:"NOCHMAL",crash:"UNFALL",score:"Punkte: ",best:"Rekord: ",unlocked:"NEUES AUTO FREIGESCHALTET: ",pick:"! Wähle es unten aus.",newcar:"NEUES AUTO: ",near:"KNAPP VORBEI x",combo:"COMBO x",
  help:"Wische nach links/rechts (Laptop: Pfeiltasten oder A/D). Nitro: Knopf oder Taste N. Fahr dicht an Autos vorbei für Bonuspunkte und schalte mit deinem Score neue Autos frei!",
  info:["Ausgewogen","Längeres Nitro","Präzise Lenkung, schneller","Größerer Beinahe-Bonus","Am schnellsten, viel Nitro"]},
 es:{go:"JUGAR",again:"REPETIR",crash:"CHOQUE",score:"Puntos: ",best:"Récord: ",unlocked:"COCHE NUEVO DESBLOQUEADO: ",pick:". Elígelo abajo.",newcar:"COCHE NUEVO: ",near:"POR POCO x",combo:"COMBO x",
  help:"Desliza el dedo a izquierda/derecha (portátil: flechas o A/D). Nitro: botón o tecla N. Pasa cerca de los coches para un bonus y desbloquea coches nuevos con tus puntos.",
  info:["Equilibrado","Nitro más largo","Dirección precisa, más rápido","Mayor bonus por pasar rozando","El más rápido, mucho nitro"]},
 fr:{go:"JOUER",again:"REJOUER",crash:"ACCIDENT",score:"Score : ",best:"Record : ",unlocked:"NOUVELLE VOITURE DÉBLOQUÉE : ",pick:" ! Choisis-la en bas.",newcar:"NOUVELLE VOITURE : ",near:"DE PEU x",combo:"COMBO x",
  help:"Glisse le doigt à gauche/droite (ordinateur : flèches ou A/D). Nitro : bouton ou touche N. Frôle les voitures pour un bonus et débloque de nouvelles voitures avec ton score !",
  info:["Équilibrée","Nitro plus long","Direction précise, plus rapide","Plus gros bonus de frôlement","La plus rapide, beaucoup de nitro"]},
 it:{go:"GIOCA",again:"RIPROVA",crash:"INCIDENTE",score:"Punti: ",best:"Record: ",unlocked:"NUOVA AUTO SBLOCCATA: ",pick:"! Scegline una qui sotto.",newcar:"NUOVA AUTO: ",near:"PER UN SOFFIO x",combo:"COMBO x",
  help:"Trascina il dito a sinistra/destra (computer: frecce o A/D). Nitro: pulsante o tasto N. Sfiora le auto per un bonus e sblocca nuove auto con il punteggio!",
  info:["Equilibrata","Nitro più lungo","Sterzo preciso, più veloce","Bonus sfioramento maggiore","La più veloce, tanto nitro"]},
 pl:{go:"START",again:"JESZCZE RAZ",crash:"WYPADEK",score:"Wynik: ",best:"Rekord: ",unlocked:"NOWE AUTO ODBLOKOWANE: ",pick:"! Wybierz je poniżej.",newcar:"NOWE AUTO: ",near:"O WŁOS x",combo:"COMBO x",
  help:"Przesuwaj palec w lewo/prawo (laptop: strzałki lub A/D). Nitro: przycisk lub klawisz N. Mijaj auta jak najbliżej dla bonusu i odblokowuj nowe auta za punkty!",
  info:["Wyważone","Dłuższe nitro","Precyzyjne sterowanie, szybsze","Większy bonus za mijanie","Najszybsze, dużo nitro"]},
 tr:{go:"BAŞLA",again:"TEKRAR",crash:"KAZA",score:"Skor: ",best:"Rekor: ",unlocked:"YENİ ARABA AÇILDI: ",pick:"! Aşağıdan seç.",newcar:"YENİ ARABA: ",near:"ÇOK YAKIN x",combo:"KOMBO x",
  help:"Parmağını sola/sağa kaydır (bilgisayarda oklar veya A/D). Nitro: düğme veya N tuşu. Arabalara yakın geçerek bonus kazan, puanlarla yeni arabaların kilidini aç!",
  info:["Dengeli","Daha uzun nitro","Hassas direksiyon, daha hızlı","Daha büyük yakın geçiş bonusu","En hızlı, bol nitro"]}
};
let lang=(navigator.language||"en").slice(0,2);if(!TX[lang])lang="en";
try{const sv=localStorage.getItem("rl_lang");if(TX[sv])lang=sv}catch(e){}
const T=k=>TX[lang][k];
let lastS=0;
function fillOver(){
  $('t').textContent=T('crash');$('big').textContent=T('score')+lastS;
  $('m').textContent=newCars.length?T('unlocked')+newCars.join(', ')+T('pick'):'';
  showBest();$('go').textContent=T('again');
}
function applyLang(){
  $('lg').textContent='🌐 '+LANGS[lang];
  if(mode==='over')fillOver();
  else{$('go').textContent=T('go');if(mode==='menu')$('m').textContent=T('help');showBest()}
  garage();
}
const lgs=$('lgs');
Object.keys(LANGS).forEach(k=>{
  const b=document.createElement('button');b.textContent=LANGS[k];
  b.addEventListener('click',()=>{lang=k;try{localStorage.setItem('rl_lang',k)}catch(e){}lgs.classList.remove('open');applyLang()});
  lgs.appendChild(b);
});
$('lg').addEventListener('click',()=>lgs.classList.toggle('open'));

const CARS=[
 {n:'Piros Villám',col:'#ff2d2d',th:0,grip:1,drain:.33,spd:1,regen:.1,bonus:1,info:'Kiegyensúlyozott'},
 {n:'Kék Fantom',col:'#2d7dff',th:500,grip:1,drain:.22,spd:1.03,regen:.12,bonus:1,info:'Hosszabb nitró'},
 {n:'Arany Sárkány',col:'#ffc21a',th:1500,grip:1.35,drain:.3,spd:1.06,regen:.12,bonus:1,info:'Pontos kormányzás, gyorsabb'},
 {n:'Neon Vipera',col:'#38ffa0',th:3500,grip:1.15,drain:.26,spd:1.08,regen:.14,bonus:1.6,info:'Nagyobb near miss bónusz'},
 {n:'Fekete Árnyék',col:'#22222e',th:7000,grip:1.3,drain:.2,spd:1.14,regen:.2,bonus:1.6,info:'A leggyorsabb, sok nitró'}
];
const ACC=[null,'#ffffff','#5a3f00','#0a3a25','#ff2d2d'];
let sel=0,unl=best;
try{unl=+localStorage.getItem('rl_max')||best;sel=+localStorage.getItem('rl_car')||0}catch(e){}
if(!CARS[sel]||CARS[sel].th>unl)sel=0;
function garage(){
  const g=$('gar');g.innerHTML='';
  CARS.forEach((c,i)=>{
    const ok=unl>=c.th,b=document.createElement('button');
    b.className='cb'+(i===sel?' sel':'')+(ok?'':' lock');
    b.innerHTML='<i style="background:'+c.col+';box-shadow:0 0 0 1px #666"></i><span>'+(ok?c.n:'🔒 '+c.th)+'</span>';
    b.addEventListener('click',()=>{if(!ok)return;sel=i;try{localStorage.setItem('rl_car',sel)}catch(e){}garage()});
    g.appendChild(b);
  });
  $('ci').textContent=CARS[sel].n+': '+T('info')[sel];
}
garage();applyLang();

function start(){
  boostF=1;newCars=[];cars=[];smoke=[];pops=[];score=0;combo=0;dist=0;t=0;nitro=1;vx=0;spawn=.4;shake=0;
  px=tx=x0+lw*2.5;mode='play';$('ov').classList.add('hide');
}
function end(){
  mode='over';const s=Math.floor(score);
  if(s>best){best=s;try{localStorage.setItem('rl_best',best)}catch(e){}}
  lastS=s;
  try{localStorage.setItem('rl_max',Math.floor(unl))}catch(e){}garage();fillOver();$('ov').classList.remove('hide');
}
$('go').addEventListener('click',start);

// kormányzás: relatív húzás
let dragX=null,dragId=null,carX0=0;
addEventListener('pointerdown',e=>{if(e.target.id==='nb'||dragId!==null)return;dragId=e.pointerId;dragX=e.clientX;carX0=px||W/2});
addEventListener('pointermove',e=>{if(e.pointerId===dragId&&mode==='play')tx=carX0+(e.clientX-dragX)*1.25});
const endDrag=e=>{if(e.pointerId===dragId){dragId=null;dragX=null}};
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);
const nb=$('nb');
nb.addEventListener('pointerdown',e=>{nitroOn=true;nb.classList.add('on');e.stopPropagation()});
['pointerup','pointercancel','pointerleave'].forEach(n=>nb.addEventListener(n,()=>{nitroOn=false;nb.classList.remove('on')}));
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('contextmenu',e=>e.preventDefault());
const keys={l:0,r:0};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='n'){nitroOn=true;nb.classList.add('on')}
  else if(k==='arrowleft'||k==='a')keys.l=1;
  else if(k==='arrowright'||k==='d')keys.r=1;
  else if((k==='enter'||k===' ')&&mode!=='play'&&!(e.target&&e.target.tagName==='BUTTON')){start()}
  else return;
  e.preventDefault();
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='n'){nitroOn=false;nb.classList.remove('on')}
  else if(k==='arrowleft'||k==='a')keys.l=0;
  else if(k==='arrowright'||k==='d')keys.r=0;
});

function pop(txt,x,y,c,l){pops.push({t:txt,x,y,l:l||1,c})}

function update(dt){
  t+=dt;const cd=CARS[sel],grow=1+Math.min(t*.005,1);
  const boost=nitroOn&&nitro>0;
  if(boost)nitro=Math.max(0,nitro-dt*cd.drain);else if(!nitroOn)nitro=Math.min(1,nitro+dt*cd.regen);
  const tgt=boost?1.5:1;boostF+=Math.max(-.6*dt,Math.min(.3*dt,tgt-boostF));
  speed=(400+Math.min(t*7,900))*S*cd.spd*boostF;
  dist+=speed*dt;score+=speed*dt/S/26;
  if(score>unl){const old=unl;unl=score;for(const c of CARS)if(old<c.th&&unl>=c.th){newCars.push(c.n);pop(T('newcar')+c.n+'!',W/2,H*.32,'#5cf',2.6)}}
  if(keys.l||keys.r){
    tx+=((keys.r?1:0)-(keys.l?1:0))*430*S*dt;
    tx=Math.max(px-lw*.8,Math.min(px+lw*.8,tx));keys.was=1;
  }else if(keys.was){tx=px+vx*.04;keys.was=0}

  // csúszós kormányzás (rugó + csillapítás)
  vx+=((tx-px)*55*cd.grip-vx*9*Math.sqrt(cd.grip))*dt;px+=vx*dt;
  const lo=x0+cw*.6,hi=x0+rw-cw*.6;
  if(px<lo){px=lo;vx=Math.abs(vx)*.2}
  if(px>hi){px=hi;vx=-Math.abs(vx)*.2}
  tx=Math.max(lo,Math.min(hi,tx));
  if(Math.abs(vx)>330*S&&Math.random()<.7)smoke.push({x:px+(Math.random()-.5)*cw,y:py+ch*.4,l:.5});

  spawn-=dt;
  if(spawn<=0){
    spawn=Math.max(.24,.72-t*.007)*(.75+Math.random()*.5);
    const lane=Math.floor(Math.random()*4),onc=lane<2;
    const y=-ch;
    if(!cars.some(c=>c.lane===lane&&c.y<ch*2.2))
      cars.push({lane,x:x0+lw*(lane+.5),y,onc,vt:onc?0:(110+Math.random()*90)*S*grow,col:COLS[Math.floor(Math.random()*COLS.length)],passed:false});
  }
  for(const c of cars){
    c.y+=(c.onc?speed+230*S*grow:speed-c.vt)*dt;
    const dx=Math.abs(c.x-px),dy=Math.abs(c.y-py);
    if(dx<(cw+cw)/2*.86&&dy<ch*.9){
      if(navigator.vibrate)navigator.vibrate(120);end();return;
    }
    if(!c.passed&&c.y>py+ch*.2){
      c.passed=true;
      if(dx<cw*1.15){
        combo++;comboT=3;score+=40*combo*cd.bonus;nitro=Math.min(1,nitro+.12*cd.bonus);
        pop(T('near')+combo,px,py-ch*1.2,'#ffb000');
      }
    }
  }
  cars=cars.filter(c=>c.y<H+ch*2);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
  for(const s of smoke){s.l-=dt;s.y+=speed*dt*.8}
  smoke=smoke.filter(s=>s.l>0);
  for(const p of pops){p.l-=dt;p.y-=40*dt}
  pops=pops.filter(p=>p.l>0);
  shake=Math.max(0,shake-dt);
}

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function car(x,y,col,rot,facingUp,st){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.fillStyle='rgba(0,0,0,.4)';rr(-cw/2+3,-ch/2+5,cw,ch,cw*.22);ctx.fill();
  ctx.fillStyle=col;rr(-cw/2,-ch/2,cw,ch,cw*.22);ctx.fill();
  if(st){ctx.fillStyle=ACC[st];ctx.fillRect(-cw*.15,-ch/2+2,cw*.1,ch-4);ctx.fillRect(cw*.05,-ch/2+2,cw*.1,ch-4)}
  ctx.fillStyle='rgba(10,12,20,.75)';
  rr(-cw*.38,-ch*.2,cw*.76,ch*.22,cw*.08);ctx.fill();   // szélvédő
  rr(-cw*.36,ch*.14,cw*.72,ch*.16,cw*.06);ctx.fill();    // hátsó ablak
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(-cw*.36,-ch*.02,cw*.72,ch*.14);
  const front=facingUp?-1:1,fy=front*ch/2,by=-front*ch/2;
  ctx.fillStyle='#fff6c9';ctx.fillRect(-cw*.42,fy-(front>0?cw*.12:0),cw*.24,cw*.12);ctx.fillRect(cw*.18,fy-(front>0?cw*.12:0),cw*.24,cw*.12);
  ctx.fillStyle='#ff2020';ctx.fillRect(-cw*.42,by-(by>0?cw*.12:0),cw*.24,cw*.12);ctx.fillRect(cw*.18,by-(by>0?cw*.12:0),cw*.24,cw*.12);
  ctx.restore();
}

function draw(){
  ctx.save();
  ctx.fillStyle='#0c1410';ctx.fillRect(0,0,W,H);
  if(shake>0)ctx.translate((Math.random()-.5)*16*shake,(Math.random()-.5)*16*shake);
  // pálya
  ctx.fillStyle='#1c1c24';ctx.fillRect(x0,0,rw,H);
  ctx.fillStyle='#e8e8f0';ctx.fillRect(x0-3,0,4,H);ctx.fillRect(x0+rw-1,0,4,H);
  ctx.fillStyle='#ffc21a';ctx.fillRect(x0+rw/2-4,0,2.5,H);ctx.fillRect(x0+rw/2+1.5,0,2.5,H);
  const off=dist%(70*S+0);
  ctx.fillStyle='rgba(255,255,255,.55)';
  for(let l=1;l<4;l++){if(l===2)continue;
    for(let y=-70*S+off;y<H;y+=70*S)ctx.fillRect(x0+l*lw-1.5,y,3,34*S)}
  // oszlopok és fények az út szélén
  const gap=150*S,o2=dist%gap;
  for(let y=-gap+o2;y<H;y+=gap){
    for(const side of[-1,1]){
      const lx=side<0?x0-14*S:x0+rw+14*S;
      const g=ctx.createRadialGradient(lx,y,0,lx,y,46*S);g.addColorStop(0,'rgba(255,190,90,.55)');g.addColorStop(1,'rgba(255,190,90,0)');
      ctx.fillStyle=g;ctx.fillRect(lx-46*S,y-46*S,92*S,92*S);
      ctx.fillStyle='#ffd38a';ctx.beginPath();ctx.arc(lx,y,3*S+1,0,6.283);ctx.fill();
    }
  }
  // sebességcsíkok nitróval
  if(mode==='play'&&nitroOn&&nitro>0){
    ctx.strokeStyle='rgba(255,140,40,.35)';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<14;i++){const sx=x0+((i*97+t*13)%rw),sy=((i*211+t*900)%H);ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+60*S)}
    ctx.stroke();
  }
  // forgalom
  for(const c of cars)car(c.x,c.y,c.col,0,c.onc?false:true);
  // autó fényszórója + játékos
  if(mode!=='over'){
    const x=mode==='menu'?x0+lw*2.5:px,rot=mode==='menu'?0:Math.max(-.45,Math.min(.45,vx*.0007/Math.max(S,.5)));
    for(const s of smoke){ctx.globalAlpha=s.l*.9;ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(s.x,s.y,10*S*(1.2-s.l),0,6.283);ctx.fill()}
    ctx.globalAlpha=1;
    const g=ctx.createLinearGradient(0,py-ch*3.4,0,py-ch/2);g.addColorStop(0,'rgba(255,240,180,0)');g.addColorStop(1,'rgba(255,240,180,.28)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-cw*.4,py-ch/2);ctx.lineTo(x-cw*1.5,py-ch*3.4);ctx.lineTo(x+cw*1.5,py-ch*3.4);ctx.lineTo(x+cw*.4,py-ch/2);ctx.fill();
    if(nitroOn&&nitro>0&&mode==='play'){ctx.fillStyle='rgba(255,140,30,.9)';ctx.beginPath();ctx.moveTo(x-cw*.25,py+ch/2);ctx.lineTo(x,py+ch/2+cw*(1+Math.random()*.6));ctx.lineTo(x+cw*.25,py+ch/2);ctx.fill()}
    car(x,py,CARS[sel].col,rot,true,sel);
  }
  // szöveges felugrók
  ctx.textAlign='center';ctx.font='italic bold '+Math.floor(16*Math.max(S,.8)+2)+'px Arial Black,Arial';
  for(const p of pops){ctx.globalAlpha=Math.min(1,p.l*1.5);ctx.fillStyle=p.c;ctx.fillText(p.t,p.x,p.y)}
  ctx.globalAlpha=1;ctx.restore();
  // vignetta
  const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

let last=performance.now(),acc=0;
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  if(mode==='play')update(dt);else{t+=dt;dist+=120*S*dt}
  draw();
  acc+=dt;if(acc>.06){acc=0;
    $('sc').textContent=Math.floor(score);
    $('cb').textContent=combo>1?T('combo')+combo:'';
    $('kmh').firstChild.nodeValue=mode==='play'?Math.round(speed/S/2.6):0;
    const m=Math.round(nitro*100);nb.style.background='linear-gradient(to top,#ff7a00 '+m+'%,#2a1a10 '+m+'%)';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
